name: Dirichlet host fixtures (not GPU/device qualification)
on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:

jobs:
  host-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ICK: ${{ github.workspace }}/.ick-native/build/native-polar/stage/bin/gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the accepted native complex runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ick
          ref: b52d9acce9c71cd8e84494ffa28c03a973a39011
          path: .ick-native
          submodules: true
          persist-credentials: false
      - name: Install native compiler bootstrap dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
      - name: Build and qualify ICK with its own native target runtimes
        working-directory: .ick-native
        run: make -f qualification/native-polar/Makefile build check
      - name: Build and run independent C fixtures
        run: |
          "$ICK" -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            code/dirichlet_eval.c tests/dirichlet_host.c -lm -o /tmp/dirichlet-host
          /tmp/dirichlet-host
      - name: Test portable Android GLES uniform/control state on C11 host
        run: |
          "$ICK" -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            code/dirichlet_view.c code/characters.c tests/dirichlet-view.c -lm -o /tmp/dirichlet-view
          /tmp/dirichlet-view
      - name: Run JavaScript numerical fixtures
        run: node --test tests/eval.test.mjs
      - name: Compare independent C11 and JavaScript evaluators on 243 grid samples
        run: |
          "$ICK" -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            code/dirichlet_eval.c code/characters.c tests/numeric-grid-cli.c -lm -o /tmp/dirichlet-grid
          node tests/cpu-grid.mjs /tmp/dirichlet-grid
      - name: Check browser smoke script shell syntax before GPU acceptance
        run: bash -n tests/browser-smoke.sh
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.mjs
          node --check tests/shader-parity.mjs
